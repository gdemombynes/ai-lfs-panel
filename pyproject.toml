[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lfspanel"
version = "0.1.0"
description = "Harmonized labor force survey panel (ISCO-08 / ISIC Rev.4) for low- and middle-income countries"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0,<2.3",
    "numpy>=1.24,<2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "pyreadstat>=1.2,<1.3",
    "requests>=2.28",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]
analysis = [
    "statsmodels>=0.14",
    "linearmodels>=5.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lfspanel = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
